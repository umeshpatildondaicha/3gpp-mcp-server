# 3GPP KB — Postgres 16 + pgvector, reproducible on macOS via Docker Desktop.
#   docker compose up -d          # starts DB, auto-applies schema.sql on first boot
#   docker compose down           # stop (keeps data volume)
#   docker compose down -v        # stop and DELETE data
services:
  pg:
    image: pgvector/pgvector:pg16          # official pgvector image, extension preinstalled
    container_name: threegpp-pg
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: threegpp_kb
    ports:
      - "5432:5432"                          # host localhost:5432 -> container
    shm_size: "1g"                           # room for HNSW index build
    volumes:
      - threegpp_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d threegpp_kb"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  threegpp_pgdata:
