server.port=${MELODY_PORT:${PORT:3000}}
# Do not delete. MELODY_CONTEXT is the platform's own variable name; Spring only
# reads it because this line maps it. Without the line the context path silently
# falls back to root, every endpoint moves (…/mcp-3gpp-service/mcp becomes /mcp),
# and a client pointed at the deployed URL gets 404 on every call — which the MCP
# client reports as a terminated session. SERVER_SERVLET_CONTEXT_PATH also works
# via Spring's relaxed binding, but only if the deployment sets that name instead.
server.servlet.context-path=${MELODY_CONTEXT:/}

# ── Transport timeouts ───────────────────────────────────────────────────────
# STREAMABLE (below) runs every exchange as a Spring MVC async request, and the
# server->client stream stays open between tool calls. Tomcat's default async
# timeout is 30 s, so anything that takes longer than that — a slow tool call,
# or simply a gap while the client's LLM is thinking — makes the container end
# the async request itself. The transport dies with it and the client reports
#     "MCP session with server terminated"
# even though the JVM never faulted and the pod never restarted.
#
# That is why the symptom looks model-dependent: a slower model leaves longer
# gaps between tool calls, so it trips the 30 s window that a faster one does
# not. If RESTARTS on the pod is 0 and stable, this is the cause — a crash would
# show up as a restart and would not care which model was driving.
#
# -1 disables the async timeout, which is what a streaming transport needs; the
# connection/keep-alive values give the idle stream room at the socket layer.
# NOTE: an ingress or load balancer in front of this has its own idle timeout
# (nginx defaults to 60 s) and must be raised separately —
# (nginx defaults to 60 s) and must be raised separately —
#   nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
#   nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spring.mvc.async.request-timeout=${ASYNC_REQUEST_TIMEOUT:-1}
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT:300000}
server.tomcat.keep-alive-timeout=${TOMCAT_KEEPALIVE_TIMEOUT:300000}
server.tomcat.max-keep-alive-requests=-1

spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=3gpp-telecom-kb
spring.ai.mcp.server.version=2.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=3GPP Telecom knowledge-base MCP server
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

app.session-ttl-ms=${SESSION_TTL_MS:1800000}
app.kb-db-path=${KB_DB_PATH:classpath:3gpp_certified.db}
app.kb-db-path2=${KB_DB_PATH2:classpath:telecom_extras.db}

# ── Embedding model: BGE-M3 (matches BAAI/bge-m3 used to build the DBs) ──────
app.embed-model-name=${EMBED_MODEL_NAME:BAAI/bge-m3}
app.embed-dim=${EMBED_DIM:1024}

# Spring AI Transformers: point to BGE-M3 ONNX (Xenova mirror).
# CLS pooling matches BGE-M3's training recipe. L2-normalisation done in EmbeddingService.
spring.ai.embedding.transformer.onnx.model-uri=${EMBED_MODEL_URI:https://huggingface.co/Xenova/bge-m3/resolve/main/onnx/model_quantized.onnx}
spring.ai.embedding.transformer.tokenizer.uri=${EMBED_TOKENIZER_URI:https://huggingface.co/Xenova/bge-m3/resolve/main/tokenizer.json}
spring.ai.embedding.transformer.metadata-mode=EMBED
spring.ai.embedding.transformer.options.model-output-name=last_hidden_state
spring.ai.embedding.transformer.options.pooling=CLS


management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ── Stage-2 cross-encoder reranker ────────────────────────────────────────────
# Default: mixedbread-ai/mxbai-rerank-xsmall-v1 (INT8, ~45 MB, fully public).
# For higher accuracy switch to BAAI/bge-reranker-v2-m3 via env vars + HF_TOKEN:
#   RERANKER_MODEL_URI=https://huggingface.co/Xenova/bge-reranker-v2-m3/resolve/main/onnx/model_quantized.onnx
#   RERANKER_TOKENIZER_URI=https://huggingface.co/BAAI/bge-reranker-v2-m3/resolve/main/tokenizer.json
# Models cached in ~/.cache/3gpp-mcp/ on first run; instant on restart.
app.reranker.enabled=${RERANKER_ENABLED:true}
# max-length: max tokens per (query+passage) pair — truncates longer passages
app.reranker.max-length=${RERANKER_MAX_LENGTH:384}
app.reranker.model-uri=${RERANKER_MODEL_URI:https://huggingface.co/mixedbread-ai/mxbai-rerank-xsmall-v1/resolve/main/onnx/model_quantized.onnx}
app.reranker.tokenizer-uri=${RERANKER_TOKENIZER_URI:https://huggingface.co/mixedbread-ai/mxbai-rerank-xsmall-v1/resolve/main/tokenizer.json}

# ── Glossary (3GPP acronyms → expansions) ─────────────────────────────────────
# TSV: ABBREV<TAB>expansion. Used by GlossaryService.expand() for OR fallback +
# dense embedding query. Override path to ship a different glossary.
app.glossary-path=${GLOSSARY_PATH:classpath:3gpp-vocab.tsv}

# ── Retrieval pipeline tuning (RetrievalProperties) ───────────────────────────
# All values here drive KbDataService scoring. Changing them does NOT require
# a recompile. Defaults reflect the 2026-05-08 OAM benchmark baseline
# (TOP1 36/50 = 72%, TOP5 49/50 = 98%). Re-run benchmark_oam.py after any change.

# Per-spec diversity caps
app.retrieval.max-dense-per-spec=${RETRIEVAL_MAX_DENSE_PER_SPEC:5}
app.retrieval.max-hybrid-per-spec=${RETRIEVAL_MAX_HYBRID_PER_SPEC:1}
# Raised 2 → 4 (2026-07-27). The cross-encoder decides a spec's rank from the best
# of the chunks it is shown; at 2 chunks per spec out of hundreds, the right clause
# frequently never reached it — 23.401's "dedicated bearer activation" clause is at
# chunk_index 480 and lost to a definition chunk from the same spec. See below.
app.retrieval.max-rerank-per-spec=${RETRIEVAL_MAX_RERANK_PER_SPEC:4}

# Candidate pool sizes
# Raised 24 → 40 with max-rerank-per-spec 2 → 4 (2026-07-27). Measured on the
# 98-question benchmark: TOP1 64 → 70 (+6), TOP5 92 → 95 (+3). Cost is real —
# p50 latency 2657 → 4953 ms — because rerank cost is linear in candidates. This
# trades latency for accuracy deliberately; drop both back via env if a deployment
# needs the speed. An intermediate arm (32/3) measured worse on TOP1 (66) than
# leaving the pool alone, so this is not a smooth knob — re-benchmark any change.
app.retrieval.rerank-candidates=${RERANK_CANDIDATES:40}
app.retrieval.hybrid-candidate-mult=${RETRIEVAL_HYBRID_CANDIDATE_MULT:10}
app.retrieval.max-hybrid-candidates=${RETRIEVAL_MAX_HYBRID_CANDIDATES:300}
app.retrieval.binary-filter-oversample=${RETRIEVAL_BINARY_FILTER_OVERSAMPLE:4}
app.retrieval.max-oversample=${RETRIEVAL_MAX_OVERSAMPLE:200}

# Scoring (RRF + discounts)
app.retrieval.min-result-score=${RETRIEVAL_MIN_RESULT_SCORE:0.15}
app.retrieval.co-occurrence-boost=${RETRIEVAL_CO_OCCURRENCE_BOOST:1.5}
app.retrieval.rrf-k=${RETRIEVAL_RRF_K:60}
app.retrieval.study-report-discount=${RETRIEVAL_STUDY_REPORT_DISCOUNT:0.50}
app.retrieval.extras-db-discount=${RETRIEVAL_EXTRAS_DB_DISCOUNT:0.50}
app.retrieval.extras-db-neutral-weight=${RETRIEVAL_EXTRAS_DB_NEUTRAL_WEIGHT:1.30}

# Release-aware ranking — applied only when the query names a release.
# Release is otherwise a hard filter; this rewards consistency when it's implied.
app.retrieval.release-match-boost=${RETRIEVAL_RELEASE_MATCH_BOOST:1.25}
app.retrieval.release-mismatch-discount=${RETRIEVAL_RELEASE_MISMATCH_DISCOUNT:0.85}

# Vector rescue — REMOVED 2026-07-27. The idea (floor the post-rerank score for
# chunks the dense retriever ranked highly, so one cross-encoder misjudgement
# cannot discard them) was implemented and measured on the 98-question benchmark:
#   min-cosine 0.62 -> 64/98 TOP1 (floor never binds; inert)
#   min-cosine 0.45 -> 60/98 TOP1 (-4), FM 6->3
#   min-cosine 0.00 -> 32/50 orderings changed, no net gain
# It was also solving a problem that is not occurring: TOP5 is 95/98, so the
# reranker is not discarding correct specs. The mechanism, its two knobs and the
# SearchHit.denseScore field it required were deleted rather than left disabled.
# Do not re-add without re-running bench/run_bench.py.

# Retriever agreement — depth into each retriever's OWN ranking when checking
# whether dense and BM25 independently support a spec. Feeds confidence only.
app.retrieval.agreement-top-n=${RETRIEVAL_AGREEMENT_TOP_N:10}

# Confidence gate — thresholds on the rank1−rank2 score margin.
# Calibrated on the 100-question baseline; see RetrievalProperties for the data.
app.retrieval.confidence-high-margin=${RETRIEVAL_CONFIDENCE_HIGH_MARGIN:0.12}
# "none" tier — the degenerate-tie signature. Both must hold: a low top score
# alone is NOT failure (12/100 benchmark questions score below 0.30 and 9 of
# those are still TOP1-correct). The conjunction fires on 1 of 100 well-formed
# questions, and that one was already a miss.
app.retrieval.confidence-none-top-score=${RETRIEVAL_CONFIDENCE_NONE_TOP_SCORE:0.25}
app.retrieval.confidence-none-margin=${RETRIEVAL_CONFIDENCE_NONE_MARGIN:0.02}

# Stub suppression
app.retrieval.stub-max-chunks-per-spec=${RETRIEVAL_STUB_MAX_CHUNKS_PER_SPEC:2}
app.retrieval.stub-max-chunk-text-length=${RETRIEVAL_STUB_MAX_CHUNK_TEXT_LENGTH:1500}

# BM25 query construction
app.retrieval.and-term-limit=${RETRIEVAL_AND_TERM_LIMIT:4}

# Study-report numeric range — fallback when DB doc_type isn't 'TR'.
# 3GPP convention: spec numbers in [start, end) after the dot are TR/study items.
app.retrieval.study-report-range-start=${RETRIEVAL_STUDY_REPORT_RANGE_START:700}
# End raised 900 → 1000 (2026-07-27). The whole 9xx band was unprotected: all 63
# specs with spec_id xx.900–xx.999 (5220 chunks) carry doc_type='TS' in this DB
# yet every one is a genuine study report — 23.909 "Technical report on the
# Gateway Location Register", 38.900 "Study on channel model…", 38.912 "Study on
# New Radio (NR) access technology". They were taking 15 top-5 and 2 top-1 slots
# across the benchmark with no discount applied at all. All 63 were checked: none
# is a real TS and none appears in any gold set.
app.retrieval.study-report-range-end=${RETRIEVAL_STUDY_REPORT_RANGE_END:1000}

# Lexicon resource paths
app.retrieval.stop-words-path=${RETRIEVAL_STOP_WORDS_PATH:classpath:retrieval/stop-words.txt}
app.retrieval.and-term-subst-path=${RETRIEVAL_AND_TERM_SUBST_PATH:classpath:retrieval/and-term-subst.tsv}
app.retrieval.non3gpp-intent-terms-path=${RETRIEVAL_NON_3GPP_INTENT_TERMS_PATH:classpath:retrieval/non-3gpp-intent-terms.txt}
app.retrieval.spec-ownership-path=${RETRIEVAL_SPEC_OWNERSHIP_PATH:classpath:retrieval/spec-ownership.tsv}
# getProcedureFlow — evidence floors. Measured on the 10-procedure eval: without
# these the tool reported 0 empty layers across all 10 and averaged 13.3 specs /
# 23k chars per call, including hits scoring as low as 0.107.
app.retrieval.procedure-layer-floor=${RETRIEVAL_PROCEDURE_LAYER_FLOOR:0.30}
app.retrieval.procedure-layer-relative-floor=${RETRIEVAL_PROCEDURE_LAYER_RELATIVE_FLOOR:0.45}
app.retrieval.test-spec-prefixes-path=${RETRIEVAL_TEST_SPEC_PREFIXES_PATH:classpath:retrieval/test-spec-prefixes.txt}
app.retrieval.procedure-layers-path=${RETRIEVAL_PROCEDURE_LAYERS_PATH:classpath:retrieval/procedure-layers.tsv}
app.retrieval.procedure-synonyms-path=${RETRIEVAL_PROCEDURE_SYNONYMS_PATH:classpath:retrieval/procedure-synonyms.tsv}
app.retrieval.series-catalog-path=${RETRIEVAL_SERIES_CATALOG_PATH:classpath:retrieval/series-catalog.tsv}
# Boost for a layer's preferred spec family (e.g. 23.4xx on an LTE flow).
app.retrieval.procedure-prefer-boost=${RETRIEVAL_PROCEDURE_PREFER_BOOST:1.35}

app.retrieval.intents-path=${RETRIEVAL_INTENTS_PATH:classpath:retrieval/intents.tsv}
app.retrieval.intent-exemplars-path=${RETRIEVAL_INTENT_EXEMPLARS_PATH:classpath:retrieval/intent-exemplars.tsv}
# Cosine floor for trusting the nearest-exemplar match. Below this the keyword
# rules are used instead. BGE-M3 cosines between related short phrases sit around
# 0.55-0.75, so this is a permissive floor that mainly rejects nonsense queries.
app.retrieval.intent-min-similarity=${RETRIEVAL_INTENT_MIN_SIMILARITY:0.50}

# ── Sentence-level answer extraction (SentenceSelectionProperties) ────────────
# Adaptive answer-focused compression applied to each retrieved chunk before
# returning search results. Defaults reflect the 2026-05-12 verbosity benchmark
# (0 hallucinations, ≤1 major_loss / 20 questions). Re-run bench_verbosity.py
# after any change to these values.

# Brief preset — aggressive compression for terse answers.
app.search.selection.brief.max-sentences=${SELECT_BRIEF_MAX_SENTENCES:4}
app.search.selection.brief.score-gap=${SELECT_BRIEF_SCORE_GAP:0.20}
app.search.selection.brief.mmr-lambda=${SELECT_BRIEF_MMR_LAMBDA:0.7}
app.search.selection.brief.window=${SELECT_BRIEF_WINDOW:1}
app.search.selection.brief.fallback-chars=${SELECT_BRIEF_FALLBACK_CHARS:350}

# Normal preset — default. Wider on every knob than brief.
app.search.selection.normal.max-sentences=${SELECT_NORMAL_MAX_SENTENCES:6}
app.search.selection.normal.score-gap=${SELECT_NORMAL_SCORE_GAP:0.25}
app.search.selection.normal.mmr-lambda=${SELECT_NORMAL_MMR_LAMBDA:0.7}
app.search.selection.normal.window=${SELECT_NORMAL_WINDOW:1}
app.search.selection.normal.fallback-chars=${SELECT_NORMAL_FALLBACK_CHARS:600}

# Absolute floor — sentences scoring below this are discarded regardless of preset.
app.search.selection.min-score=${SELECT_MIN_SCORE:0.20}

# Chunk-shape detection (TOC / abbreviation-table bypass).
app.search.selection.detection.toc-dot-pattern-regex=${SELECT_TOC_DOT_PATTERN:\\\\.{4,}\\\\s*\\\\d+}
app.search.selection.detection.toc-min-pattern-hits=${SELECT_TOC_MIN_PATTERN_HITS:3}
app.search.selection.detection.toc-char-multiplier=${SELECT_TOC_CHAR_MULTIPLIER:2}
app.search.selection.detection.short-line-max-chars=${SELECT_SHORT_LINE_MAX_CHARS:60}
app.search.selection.detection.short-line-ratio-pct=${SELECT_SHORT_LINE_RATIO_PCT:70}
app.search.selection.detection.shape-min-lines=${SELECT_SHAPE_MIN_LINES:5}

# List-aware MMR bypass (enumeration handling).
app.search.selection.enumeration.bucket-token-index=${SELECT_ENUM_BUCKET_TOKEN_INDEX:1}
app.search.selection.enumeration.min-bucket-count=${SELECT_ENUM_MIN_BUCKET_COUNT:3}
app.search.selection.enumeration.min-second-token-length=${SELECT_ENUM_MIN_SECOND_TOKEN_LENGTH:2}
app.search.selection.enumeration.max-picks-extra=${SELECT_ENUM_MAX_PICKS_EXTRA:3}
app.search.selection.enumeration.max-picks-floor=${SELECT_ENUM_MAX_PICKS_FLOOR:8}
app.search.selection.enumeration.brief-skip-max-sentences-threshold=${SELECT_ENUM_BRIEF_SKIP_THRESHOLD:5}
